[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-post-training-lab"
version = "0.1.0"
description = "Reproducible small language model post-training experiments"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
